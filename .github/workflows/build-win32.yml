name: Build (Windows 95 and up)

# The Windows port, targeting Windows 95 through XP.
#
# 95 OSR2 was the floor because that is where msvcrt.dll starts shipping with
# the system. The installer now carries a copy for the machines that have none,
# so RTM and OSR1 are in range too -- untested on either, and the checks below
# are what stands in for a test: a name the loader cannot resolve rejects the
# image before any of Gateway's own version handling runs, so the imports are
# verified on every build. MinGW-w64 writes a PE subsystem version of 4.0,
# which is what these loaders expect. docs/porting.md section 3 records the
# original evidence and PATCHES.md 21 the rest.
#
# Paths are scoped so this and build-macos9.yml both run when the shared core
# changes and only one runs otherwise.

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      # Shared with the Mac build.
      - 'src/portable/**'
      - 'src/proxy/**'
      - 'src/gw_core.*'
      - 'src/gw_config.*'
      - 'src/gw_platform.h'
      - 'src/gw_plat.h'
      - 'src/gw_plat_win32.c'
      # Compiled into Gateway.exe by Makefile.win32 and easy to miss,
      # being neither core nor platform nor portable.
      - 'src/gw_ca.*'
      - 'src/net/gw_transport.h'
      - 'src/net/gw_stream.c'
      - 'src/net/gw_net_win32.*'
      - 'third_party/certainly/**'
      # Windows only.
      - 'src/win32/**'
      - 'src/gw_version.h'
      - 'Makefile.win32'
      - 'installer/**'
      - 'docs/release-notes.md'
      # Shipped as Gateway.ini by the installer and the zip, so editing
      # it changes the artifact and has to rebuild. It did not, so a
      # build carried a prefs file missing the setting its own docs
      # described, and nothing said so.
      - 'docs/prefs-example.txt'
      - '.github/workflows/build-win32.yml'
  pull_request:
    paths:
      - 'src/portable/**'
      - 'src/proxy/**'
      - 'src/gw_core.*'
      - 'src/gw_config.*'
      - 'src/gw_platform.h'
      - 'src/gw_plat.h'
      - 'src/gw_plat_win32.c'
      # Compiled into Gateway.exe by Makefile.win32 and easy to miss,
      # being neither core nor platform nor portable.
      - 'src/gw_ca.*'
      - 'src/net/gw_transport.h'
      - 'src/net/gw_stream.c'
      - 'src/net/gw_net_win32.*'
      - 'third_party/certainly/**'
      - 'src/win32/**'
      - 'src/gw_version.h'
      - 'Makefile.win32'
      - 'installer/**'
      - 'docs/release-notes.md'
      # Shipped as Gateway.ini by the installer and the zip, so editing
      # it changes the artifact and has to rebuild. It did not, so a
      # build carried a prefs file missing the setting its own docs
      # described, and nothing said so.
      - 'docs/prefs-example.txt'
      - '.github/workflows/build-win32.yml'
  workflow_dispatch:

jobs:
  core:
    name: Compile the shared core for Win32
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only used by the release step, on tags
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686 binutils-mingw-w64-i686 nsis mtools zip
          i686-w64-mingw32-gcc --version | head -1

      # The point of the transport split. src/proxy is 2,100 lines of state
      # machine that should now compile against a Windows compiler without a
      # single Open Transport header in reach; if that stops being true, this
      # step says so long before anyone tries to link a Windows binary.
      - name: Build Gateway.exe
        run: make -f Makefile.win32 -j4

      - name: What it needs to run
        run: |
          ls -l build-win32/Gateway.exe
          echo
          echo "=== DLLs ==="
          i686-w64-mingw32-objdump -p build-win32/Gateway.exe | grep "DLL Name"
          echo
          echo "=== PE version fields (Windows 95 wants 4.0) ==="
          i686-w64-mingw32-objdump -p build-win32/Gateway.exe \
            | grep -Ei "MajorOSystemVersion|MajorSubsystemVersion|Subsystem"
          echo
          echo "=== msvcrt: is snprintf the C99 one? ==="
          if i686-w64-mingw32-objdump -p build-win32/Gateway.exe \
               | grep -qE "[[:space:]]_?snprintf$"; then
            echo "::error::linked msvcrt's _snprintf, which truncates unsafely"
            exit 1
          fi
          echo "  not imported from msvcrt - libmingwex supplied it"

      # The floor is an import question, not a source question: a name the
      # loader cannot resolve rejects the image before any of Gateway's own
      # version handling runs. Both of these were real (Gateway#1), so both are
      # now checked on every build rather than reasoned about.
      - name: Will it load on Windows 95 RTM and NT 3.51
        run: |
          set -euo pipefail
          DUMP="i686-w64-mingw32-objdump -p build-win32/Gateway.exe"

          echo "=== no CryptoAPI import (absent before 95 OSR2 / NT 4.0) ==="
          if $DUMP | grep -qE "[[:space:]]Crypt[A-Za-z]+$"; then
            echo "::error::static Crypt* import is back - see PATCHES.md 21"
            $DUMP | grep -E "[[:space:]]Crypt[A-Za-z]+$"
            exit 1
          fi
          echo "  clean - looked up at run time"

          echo "=== no SHELL32 import (no notification area on NT 3.51) ==="
          if $DUMP | grep -qi "DLL Name: SHELL32"; then
            echo "::error::static shell32 import is back; Shell_NotifyIconA"
            echo "::error::must stay a GetProcAddress so the fallback can run"
            exit 1
          fi
          echo "  clean - Shell_NotifyIconA looked up at run time"

          echo "=== does our bundled msvcrt.dll export everything it wants? ==="
          # Imports: objdump prints "DLL Name: x.dll", then a header row, then
          # one row per function as "<vma> <hint> <name>". Keying off a hex
          # first field skips the header without having to match its wording;
          # requiring an identifier-shaped third field skips the import
          # directory rows, which are all-hex and sit between the DLL blocks.
          $DUMP | awk '
            /DLL Name:/ { d = tolower($3); next }
            d == "msvcrt.dll" && $1 ~ /^[0-9a-f]+$/ && NF >= 3 &&
            $3 ~ /^[A-Za-z_?]/ { print $3 }
          ' | sort -u > /tmp/want.txt
          # Exports: the name table is "[<n>] <name>" under its own heading.
          i686-w64-mingw32-objdump -p installer/redist/msvcrt.dll | awk '
            /\[Ordinal\/Name Pointer\] Table/ { e = 1; next }
            e && match($0, /\] /)             { print substr($0, RSTART + 2) }
          ' | sort -u > /tmp/have.txt
          echo "  Gateway.exe wants $(wc -l < /tmp/want.txt) from msvcrt"
          echo "  our copy exports $(wc -l < /tmp/have.txt)"
          # A parse that silently produced nothing would otherwise report every
          # symbol as missing, which is what it did the first time this ran.
          # An empty list here means the check is broken, not the DLL.
          if [ ! -s /tmp/want.txt ] || [ "$(wc -l < /tmp/have.txt)" -lt 100 ]; then
            echo "::error::could not read the import or export tables --"
            echo "::error::this check is broken, not necessarily the build"
            exit 1
          fi
          if ! comm -23 /tmp/want.txt /tmp/have.txt | grep -q .; then
            echo "  every one is present"
          else
            echo "::error::the bundled msvcrt.dll is missing:"
            comm -23 /tmp/want.txt /tmp/have.txt
            exit 1
          fi

      # NSIS produces the installer, rather than a third-party one being
      # patched: the same toolchain-from-source rule the rest of this follows.
      # The stub has to be the ANSI one, since the Unicode build will not load
      # on 95, 98 or Me -- which the check below confirms rather than assumes.
      - name: Build the installer
        run: |
          set -euo pipefail
          # -DMSVCRT carries a runtime for Windows 95 RTM and OSR1, which have
          # crtdll.dll and not the msvcrt.dll MinGW links. The installer only
          # drops it on a machine whose SYSTEM directory has none, so nothing
          # from OSR2 forward is touched.
          makensis -V2 -DVERSION="$(sed -n 's/.*GW_VERSION_LONG   "\(.*\)"/\1/p' src/gw_version.h)" \
                   -DSRC=../build-win32 -DMSVCRT=redist/msvcrt.dll \
                   installer/gateway.nsi
          mv installer/Setup.exe build-win32/Setup.exe
          ls -l build-win32/Setup.exe

      # Built every time rather than only on a tag: an asset that is only ever
      # produced during a release is an asset whose first test is the release.
      - name: Make the floppy image
        run: |
          set -euo pipefail
          # 1.44 MB, which 86Box mounts directly and real hardware still reads.
          # Setup.exe is a third of a diskette, so it fits with room to spare,
          # and mtools writes the filesystem into a plain file without root or
          # a loopback mount.
          dd if=/dev/zero of=build-win32/Gateway.img bs=512 count=2880 status=none
          mformat -i build-win32/Gateway.img -f 1440 -v GATEWAY ::
          mcopy -i build-win32/Gateway.img build-win32/Setup.exe ::SETUP.EXE
          echo "--- floppy contents ---"
          mdir -i build-win32/Gateway.img ::

      - name: Will the installer run on the targets
        run: |
          echo "=== PE version fields (Windows 95 wants 4.0) ==="
          i686-w64-mingw32-objdump -p build-win32/Setup.exe \
            | grep -Ei "MajorOSystemVersion|MajorSubsystemVersion|Subsystem"
          echo
          echo "=== DLLs ==="
          i686-w64-mingw32-objdump -p build-win32/Setup.exe | grep "DLL Name"
          echo
          if i686-w64-mingw32-objdump -p build-win32/Setup.exe \
               | grep -qiE "GetProcessWindowStation|GetUserObjectInformationW"; then
            echo "::warning::installer imports a Unicode-era API; check Windows 95"
          fi

      - name: Upload the test build
        uses: actions/upload-artifact@v4
        with:
          name: Gateway-windows-95-and-up
          path: |
            build-win32/Gateway.exe
            build-win32/Setup.exe
            build-win32/Gateway.img

      # Tag pushes become release assets. Two of them: the bare executable, for
      # anyone who just wants to drop it next to an existing Gateway.ini, and a
      # zip carrying the example configuration and the settings reference,
      # which is what a first install needs.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "release/Gateway"
          cp build-win32/Setup.exe   "release/Gateway/"
          cp build-win32/Gateway.exe "release/Gateway/"
          cp docs/prefs-example.txt  "release/Gateway/Gateway.ini"
          cp docs/prefs.md           "release/Gateway/Settings.md"
          cp LICENSE                 "release/Gateway/LICENSE.txt"
          (cd release && zip -r "Gateway-${GITHUB_REF_NAME}-windows.zip" Gateway)

          IMG="release/Gateway-${GITHUB_REF_NAME}-windows.img"
          cp build-win32/Gateway.img "$IMG"

          # The Mac job may or may not have created the release yet, so both
          # jobs have to cope with either order.
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 6 ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "Gateway $GITHUB_REF_NAME" \
                --notes-file docs/release-notes.md
              break
            fi
            sleep 20
          done

          gh release upload "$GITHUB_REF_NAME" --clobber \
            "release/Gateway-${GITHUB_REF_NAME}-windows.zip" \
            "$IMG"
